name: Signing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build verified evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      evaluation_time: ${{ steps.clock.outputs.evaluation_time }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          check-latest: false
          cache: false

      - name: Fix release evaluation time
        id: clock
        run: printf 'evaluation_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - name: Verify host and container behavior
        run: |
          make verify
          make container-build
          make container-smoke

      - name: Verify scanner failure fixtures
        run: make security-fixtures

      - name: Run layered scanner gate
        env:
          EVALUATION_TIME: ${{ steps.clock.outputs.evaluation_time }}
          REPORT_DIR: .local/security-reports/release
        run: make security-scan

      - name: Generate verified integrity evidence
        run: make integrity

      - name: Stage release inputs
        env:
          SOURCE_DIGEST: ${{ github.sha }}
        run: |
          mkdir -p release-build/security/normalized
          cp -- .local/security-reports/release/decision.json release-build/security/decision.json
          cp -- .local/security-reports/release/normalized/*.json release-build/security/normalized/
          jq --null-input --arg source "$SOURCE_DIGEST" \
            '{schemaVersion:"1.0",sourceDigest:$source,tests:[
              {id:"build",state:"passed",ref:"make build"},
              {id:"container-smoke",state:"passed",ref:"make container-smoke"},
              {id:"host",state:"passed",ref:"make verify"},
              {id:"integrity",state:"passed",ref:"make integrity"},
              {id:"race",state:"passed",ref:"make test-race"},
              {id:"security-fixtures",state:"passed",ref:"make security-fixtures"}
            ]}' >release-build/tests.json

      - name: Transfer unsigned evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-evidence-${{ github.run_id }}
          path: |
            dist/image.oci.tar
            dist/image.spdx.raw.json
            dist/image.spdx.canonical.json
            dist/provenance.local.json
            dist/verification.json
            dist/tooling.json
            dist/checksums.sha256
            release-build/tests.json
            release-build/security/decision.json
            release-build/security/normalized/gitleaks.json
            release-build/security/normalized/gosec.json
            release-build/security/normalized/govulncheck.json
            release-build/security/normalized/osv-scanner.json
            release-build/security/normalized/trivy-config.json
            release-build/security/normalized/trivy-image.json
            release-build/security/normalized/trivy-license.json
            release-build/security/normalized/zizmor.json
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Keyless sign and verify
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download unsigned evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: unsigned-evidence-${{ github.run_id }}
          path: staging

      - name: Verify transferred checksums
        working-directory: staging/dist
        run: shasum -a 256 --check checksums.sha256

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Keylessly sign evidence
        run: |
          cosign sign-blob --yes --bundle staging/dist/image.oci.sigstore.json staging/dist/image.oci.tar
          cosign sign-blob --yes --bundle staging/dist/image.spdx.sigstore.json staging/dist/image.spdx.raw.json
          cosign sign-blob --yes --bundle staging/dist/provenance.local.sigstore.json staging/dist/provenance.local.json

      - name: Verify cryptography and exact workflow identity
        env:
          CERTIFICATE_IDENTITY: https://github.com/satishgampala/devsecops-supply-chain-template/.github/workflows/signing.yml@refs/heads/main
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          WORKFLOW_NAME: Signing
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_TRIGGER: ${{ github.event_name }}
        run: |
          verify_bundle() {
            artifact=$1
            bundle=$2
            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              --certificate-github-workflow-name "$WORKFLOW_NAME" \
              --certificate-github-workflow-repository "$WORKFLOW_REPOSITORY" \
              --certificate-github-workflow-ref "$WORKFLOW_REF" \
              --certificate-github-workflow-sha "$WORKFLOW_SHA" \
              --certificate-github-workflow-trigger "$WORKFLOW_TRIGGER" \
              "$artifact"
          }
          verify_bundle staging/dist/image.oci.tar staging/dist/image.oci.sigstore.json
          verify_bundle staging/dist/image.spdx.raw.json staging/dist/image.spdx.sigstore.json
          verify_bundle staging/dist/provenance.local.json staging/dist/provenance.local.sigstore.json

      - name: Record verified signing observation
        env:
          CERTIFICATE_IDENTITY: https://github.com/satishgampala/devsecops-supply-chain-template/.github/workflows/signing.yml@refs/heads/main
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          WORKFLOW_NAME: Signing
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_TRIGGER: ${{ github.event_name }}
        run: |
          printf '%s' "$WORKFLOW_SHA" | grep --extended-regexp --quiet '^[0-9a-f]{40}$'
          case "$WORKFLOW_TRIGGER" in push|workflow_dispatch) ;; *) exit 1 ;; esac
          hash_file() { shasum -a 256 "$1" | awk '{print $1}'; }
          jq --null-input \
            --arg issuer "$OIDC_ISSUER" \
            --arg identity "$CERTIFICATE_IDENTITY" \
            --arg repository "$WORKFLOW_REPOSITORY" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg ref "$WORKFLOW_REF" \
            --arg sha "$WORKFLOW_SHA" \
            --arg trigger "$WORKFLOW_TRIGGER" \
            --arg archive "$(hash_file staging/dist/image.oci.tar)" \
            --arg archiveBundle "$(hash_file staging/dist/image.oci.sigstore.json)" \
            --arg sbom "$(hash_file staging/dist/image.spdx.raw.json)" \
            --arg sbomBundle "$(hash_file staging/dist/image.spdx.sigstore.json)" \
            --arg provenance "$(hash_file staging/dist/provenance.local.json)" \
            --arg provenanceBundle "$(hash_file staging/dist/provenance.local.sigstore.json)" \
            '{
              schemaVersion: "1.0",
              issuer: $issuer,
              certificateIdentity: $identity,
              repository: $repository,
              workflowName: $workflow,
              workflowRef: $ref,
              workflowSHA: $sha,
              workflowTrigger: $trigger,
              cryptographicVerification: true,
              transparencyLogVerified: true,
              embeddedSCTVerified: true,
              artifacts: [
                {role: "local-provenance", path: "provenance.local.json", sha256: $provenance, bundle: "provenance.local.sigstore.json", bundleSHA256: $provenanceBundle, verified: true},
                {role: "oci-archive", path: "image.oci.tar", sha256: $archive, bundle: "image.oci.sigstore.json", bundleSHA256: $archiveBundle, verified: true},
                {role: "spdx-sbom", path: "image.spdx.raw.json", sha256: $sbom, bundle: "image.spdx.sigstore.json", bundleSHA256: $sbomBundle, verified: true}
              ]
            }' >staging/dist/signing-observation.json

      - name: Preserve signed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-evidence-${{ github.run_id }}
          path: |
            staging/dist/image.oci.tar
            staging/dist/image.spdx.raw.json
            staging/dist/image.spdx.canonical.json
            staging/dist/provenance.local.json
            staging/dist/verification.json
            staging/dist/tooling.json
            staging/dist/checksums.sha256
            staging/dist/image.oci.sigstore.json
            staging/dist/image.spdx.sigstore.json
            staging/dist/provenance.local.sigstore.json
            staging/dist/signing-observation.json
            staging/release-build/tests.json
            staging/release-build/security/decision.json
            staging/release-build/security/normalized/gitleaks.json
            staging/release-build/security/normalized/gosec.json
            staging/release-build/security/normalized/govulncheck.json
            staging/release-build/security/normalized/osv-scanner.json
            staging/release-build/security/normalized/trivy-config.json
            staging/release-build/security/normalized/trivy-image.json
            staging/release-build/security/normalized/trivy-license.json
            staging/release-build/security/normalized/zizmor.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  policy:
    name: Evaluate signing and release policies
    needs:
      - build
      - sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out policy verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          check-latest: false
          cache: false

      - name: Download signed evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: signed-evidence-${{ github.run_id }}
          path: staging

      - name: Evaluate exact identity policy
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          go run ./cmd/signing-policy \
            -policy policy/signing-identity.json \
            -observation staging/dist/signing-observation.json \
            -expected-sha "$EXPECTED_SHA" \
            -output staging/dist/signing-decision.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Assemble release evidence
        env:
          EVALUATION_TIME: ${{ needs.build.outputs.evaluation_time }}
          SOURCE_DIGEST: ${{ github.sha }}
        run: |
          mkdir -p .local/release-evidence
          EVIDENCE_DIR="$PWD/.local/release-evidence" \
          INTEGRITY_DIR="$PWD/staging/dist" \
          SECURITY_DIR="$PWD/staging/release-build/security" \
          SIGNING_DIR="$PWD/staging/dist" \
          TEST_SUMMARY="$PWD/staging/release-build/tests.json" \
          EVALUATION_TIME="$EVALUATION_TIME" \
          SOURCE_DIGEST="$SOURCE_DIGEST" \
            ./scripts/collect-release-evidence.sh

      - name: Evaluate complete release policy
        env:
          EVALUATION_TIME: ${{ needs.build.outputs.evaluation_time }}
        run: |
          go run ./cmd/releaseverify \
            -policy policy/release-v1.json \
            -evidence-root .local/release-evidence \
            -manifest release-evidence.json \
            -evaluation-time "$EVALUATION_TIME" \
            -output .local/release-evidence/release-decision.json

      - name: Retain signing decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signing-decision-${{ github.run_id }}
          path: staging/dist/signing-decision.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain release evidence and decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.run_id }}
          path: .local/release-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
