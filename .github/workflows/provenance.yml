name: Provenance

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attest:
    name: Build and attest release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Generate verified integrity evidence
        run: make integrity

      - name: Derive immutable OCI subject
        id: subject
        run: |
          digest="$(go run ./cmd/supply-chain subject -artifact dist/image.oci.tar)"
          case "$digest" in
            sha256:[0-9a-f][0-9a-f]*) ;;
            *) printf '%s\n' 'invalid OCI manifest digest' >&2; exit 1 ;;
          esac
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/satishgampala/devsecops-supply-chain-template
          subject-digest: ${{ steps.subject.outputs.digest }}
          show-summary: false

      - name: Attest SPDX SBOM
        id: sbom
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/satishgampala/devsecops-supply-chain-template
          subject-digest: ${{ steps.subject.outputs.digest }}
          sbom-path: dist/image.spdx.raw.json
          show-summary: false

      - name: Preserve platform bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          test -f "$PROVENANCE_BUNDLE"
          test -f "$SBOM_BUNDLE"
          cp -- "$PROVENANCE_BUNDLE" dist/provenance.github.bundle.json
          cp -- "$SBOM_BUNDLE" dist/sbom.github.bundle.json

      - name: Retain release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integrity-evidence-${{ github.run_id }}
          path: |
            dist/image.oci.tar
            dist/image.spdx.raw.json
            dist/image.spdx.canonical.json
            dist/provenance.local.json
            dist/provenance.github.bundle.json
            dist/sbom.github.bundle.json
            dist/verification.json
            dist/tooling.json
            dist/checksums.sha256
          if-no-files-found: error
          retention-days: 14
