name: Reusable Supply-Chain Validation

on:
  workflow_call:
    outputs:
      subject-digest:
        description: OCI manifest digest tested and scanned by candidate validation
        value: ${{ jobs.candidate.outputs.subject-digest }}

permissions: {}

jobs:
  candidate:
    name: Candidate validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      subject-digest: ${{ steps.subject.outputs.digest }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Set up Docker with the containerd image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.5.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - name: Test and scan one immutable candidate
        run: make candidate

      - name: Export validated subject
        id: subject
        run: |
          digest="$(jq -er '.subjectDigest' dist/tests.json)"
          printf '%s' "$digest" | grep --extended-regexp --quiet '^sha256:[0-9a-f]{64}$'
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Retain candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  contracts:
    name: Policy contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Verify scanner, signing, and release rejection contracts
        run: make security-test signing-test release-policy-test

  lint:
    name: Workflow and documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Validate all workflows and local documentation
        run: make workflow-check docs-check
