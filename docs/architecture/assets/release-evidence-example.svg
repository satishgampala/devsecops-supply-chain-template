<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1804" viewBox="0 0 1120 1804" role="img" aria-labelledby="title description">
  <title id="title">A release-evidence example: one real candidate, two rejected tamper attempts</title>
  <desc id="description">Historical local example from September 23, 2026. Source commit 81702be919a0 produces OCI subject a1f15e9a8fb1 and archive checksum 647b5ee7a188. The restricted runtime checks the digest API; eight live scanner reports and test evidence bind to the same source and image. A validation statement covers evidence and policy hashes. Four signature roles are modeled by a frozen-hash test double, not real Sigstore signatures. A separate manifest references original evidence and a signing decision; that decision identifies the four bundles. The independent verifier accepts the original evidence in the local test, rejects a rehashed test reference with VALIDATION_EVIDENCE_MISMATCH, and rejects an additionally rewritten validation statement with SIGNATURE_INVALID. This is not release authorization. Hashes shown are abbreviated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9 Z" fill="#52657d"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b46; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 1.8px; fill: #51647c; }
      .headline { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; }
      .subtitle { font-size: 21px; fill: #51647c; }
      .section { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
      .number { font-size: 16px; font-weight: 700; text-anchor: middle; fill: #fff; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 19px; fill: #42556d; }
      .small { font-size: 17px; fill: #51647c; }
      .code { font-family: Menlo, Consolas, monospace; font-size: 19px; }
      .code-small { font-family: Menlo, Consolas, monospace; font-size: 17px; }
      .white { fill: #fff; }
      .light { fill: #dceaff; }
      .green { fill: #195941; }
      .red { fill: #98342d; }
      .amber { fill: #805014; }
      .card { fill: #fff; stroke: #ccd6e2; stroke-width: 1.4; }
      .line { fill: none; stroke: #52657d; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="1804" rx="18" fill="#fff"/>
  <text class="eyebrow" x="40" y="42">WORKED EXAMPLE / RECORDED LOCAL RUN / 23 SEP 2026</text>
  <text class="headline" x="40" y="91">Follow one candidate. Catch two attacks.</text>
  <text class="subtitle" x="40" y="127">Actual build and scanner evidence; abbreviated hashes for readability.</text>
  <rect x="32" y="149" width="1056" height="42" rx="8" fill="#fff3dc" stroke="#dfc99f"/>
  <text x="560" y="176" text-anchor="middle" font-size="19" font-weight="700" class="amber">REAL CANDIDATE + LIVE REPORTS · SIGNATURES USE AN EXPLICIT TEST DOUBLE</text>

  <!-- 1. Keep source identity, OCI identity, and transport checksum distinct. -->
  <rect x="32" y="216" width="1056" height="208" rx="14" fill="#f4f7fc" stroke="#c7d5e8"/>
  <rect x="56" y="237" width="34" height="29" rx="7" fill="#285ea8"/>
  <text class="number" x="73" y="257">01</text>
  <text class="section" x="102" y="259">IDENTIFY THE SOURCE AND ARTIFACT</text>
  <rect class="card" x="56" y="284" width="330" height="114" rx="10"/>
  <text class="label" x="76" y="315">Clean source revision</text>
  <text class="code" x="76" y="345">81702be919a0…</text>
  <text class="body" x="76" y="374">Go 1.26.8 · tests + race checks</text>
  <path class="line" d="M386 341 H456"/>
  <text class="small" x="421" y="329" text-anchor="middle">build</text>
  <rect x="456" y="284" width="608" height="114" rx="10" fill="#173f78"/>
  <text class="label white" x="476" y="313">image.oci.tar</text>
  <text class="code light" x="476" y="341">OCI subject: sha256:a1f15e9a8fb1…</text>
  <text class="code-small light" x="476" y="365">Archive SHA-256: 647b5ee7a188…</text>
  <text class="small light" x="476" y="388">linux/amd64 · scratch · 2,881,536 bytes in the OCI tar</text>

  <path class="line" d="M560 424 V464"/>
  <text class="small" x="579" y="450">reuse the candidate; do not rebuild</text>

  <!-- 2. The API hashes request data; that hash is not the OCI subject. -->
  <rect x="32" y="464" width="1056" height="310" rx="14" fill="#f4f7fc" stroke="#c7d5e8"/>
  <rect x="56" y="485" width="34" height="29" rx="7" fill="#285ea8"/>
  <text class="number" x="73" y="505">02</text>
  <text class="section" x="102" y="507">TEST BEHAVIOR AND EVALUATE SECURITY</text>
  <rect class="card" x="56" y="532" width="492" height="180" rx="10"/>
  <text class="label" x="76" y="564">Runtime smoke test</text>
  <text class="code" x="76" y="593">POST /v1/digest</text>
  <text class="code" x="76" y="620">{"value":"supply-chain"}</text>
  <text class="body" x="76" y="649">Expected payload hash: 3f412634a4ea…</text>
  <text class="small" x="76" y="675">Payload hash is not the image digest.</text>
  <text class="small" x="76" y="699">User 65532:65532 · read-only · no capabilities</text>
  <rect class="card" x="574" y="532" width="490" height="180" rx="10"/>
  <text class="label" x="594" y="564">Eight normalized scanner reports</text>
  <text class="body" x="594" y="593">Gosec · govulncheck · Gitleaks</text>
  <text class="body" x="594" y="620">OSV-Scanner · zizmor</text>
  <text class="body" x="594" y="647">Trivy: configuration · image · license</text>
  <text x="594" y="677" font-size="19" font-weight="700">8 completed · 2 findings · 0 blocking</text>
  <text class="small" x="594" y="699">1 G204 exception · expires 2026-10-19</text>
  <rect x="56" y="729" width="1008" height="28" rx="6" fill="#e4edf9"/>
  <text x="560" y="749" font-size="18" text-anchor="middle">tests.json + all 8 reports bind the source commit and observed OCI subject.</text>

  <path class="line" d="M560 774 V814"/>
  <text class="small" x="579" y="800">preserve original evidence</text>

  <!-- 3. The statement is signed. The later release manifest is not a signed role. -->
  <rect x="32" y="814" width="1056" height="318" rx="14" fill="#f4f7fc" stroke="#c7d5e8"/>
  <rect x="56" y="835" width="34" height="29" rx="7" fill="#285ea8"/>
  <text class="number" x="73" y="855">03</text>
  <text class="section" x="102" y="857">BIND THE EVIDENCE BEFORE SIGNING</text>
  <rect class="card" x="56" y="882" width="468" height="150" rx="10"/>
  <text class="label" x="76" y="914">Original files</text>
  <text class="code" x="76" y="942">image.oci.tar · image.spdx.raw.json</text>
  <text class="code" x="76" y="969">provenance.local.json · tests.json</text>
  <text class="body" x="76" y="995">8 reports + decisions + versioned policies</text>
  <text class="small" x="76" y="1020">SBOM inventory and provenance name the OCI subject.</text>
  <path class="line" d="M524 957 H604"/>
  <text class="small" x="564" y="945" text-anchor="middle">hash</text>
  <rect x="604" y="882" width="460" height="150" rx="10" fill="#173f78"/>
  <text class="code white" x="624" y="915">validation-evidence.json</text>
  <text class="body light" x="624" y="949">Binds evidence hashes + policy identities</text>
  <text class="body light" x="624" y="979">Pins source, image, evaluation time + trigger</text>
  <text class="small light" x="624" y="1013">Recalculated public hashes cannot replace this binding.</text>
  <rect x="56" y="1050" width="1008" height="60" rx="8" fill="#fff3dc" stroke="#dfc99f"/>
  <text x="560" y="1075" text-anchor="middle" font-size="19" font-weight="700" class="amber">4 signature roles: OCI archive · raw SPDX · local provenance · validation statement</text>
  <text x="560" y="1098" text-anchor="middle" font-size="18" class="amber">This example freezes accepted hashes in a test verifier; it does not generate real signatures.</text>

  <path class="line" d="M560 1132 V1172"/>
  <text class="small" x="579" y="1158">assemble the final manifest afterward</text>

  <!-- 4. Paths/hashes describe inputs; verifier independently re-evaluates their contents. -->
  <rect x="32" y="1172" width="1056" height="240" rx="14" fill="#f1f8f6" stroke="#bed6ce"/>
  <rect x="56" y="1193" width="34" height="29" rx="7" fill="#247461"/>
  <text class="number" x="73" y="1213">04</text>
  <text class="section" x="102" y="1215">REOPEN AND VERIFY THE ORIGINALS</text>
  <rect class="card" x="56" y="1240" width="420" height="124" rx="10"/>
  <text class="code" x="76" y="1271">release-evidence.json</text>
  <text class="body" x="76" y="1300">Paths + SHA-256 hashes</text>
  <text class="body" x="76" y="1326">Validation statement + signing decision</text>
  <text class="body" x="76" y="1352">Signing decision references four bundles</text>
  <path class="line" d="M476 1302 H574"/>
  <text class="small" x="525" y="1290" text-anchor="middle">read</text>
  <rect class="card" x="574" y="1240" width="490" height="124" rx="10"/>
  <text class="label" x="594" y="1271">Independent Go verifier</text>
  <text class="body" x="594" y="1300">Check source, image, hashes and exact identity</text>
  <text class="body" x="594" y="1326">Re-evaluate tests, scans, policy and integrity</text>
  <text class="body" x="594" y="1352">Check freshness + all four signature roles</text>
  <text class="small" x="560" y="1393" text-anchor="middle">Policy at evaluation: reports ≤ 24 hours · required database timestamps ≤ 336 hours.</text>

  <path class="line" d="M560 1412 V1452"/>
  <text class="small" x="579" y="1438">compare original and deliberately altered evidence</text>

  <!-- 5. Attack B extends A; both outcomes are observed in the local integration. -->
  <rect x="32" y="1452" width="1056" height="282" rx="14" fill="#f7f8fa" stroke="#d3dbe4"/>
  <rect x="56" y="1473" width="34" height="29" rx="7" fill="#52657d"/>
  <text class="number" x="73" y="1493">05</text>
  <text class="section" x="102" y="1495">SAME VERIFIER, THREE OBSERVED OUTCOMES</text>
  <rect x="56" y="1520" width="322" height="190" rx="10" fill="#e8f5ee" stroke="#a9ceba"/>
  <text class="label green" x="76" y="1553">Original evidence</text>
  <text class="body" x="76" y="1584">All evidence bindings match.</text>
  <text class="code green" x="76" y="1621">eligible: true</text>
  <text class="code-small" x="76" y="1651">reasonCodes: []</text>
  <text class="small" x="76" y="1691">Test result, not release approval.</text>
  <rect x="399" y="1520" width="322" height="190" rx="10" fill="#fcefeb" stroke="#deb9b0"/>
  <text class="label red" x="419" y="1553">Attack A · rehash tests</text>
  <text class="code-small" x="419" y="1584">Change tests[0].ref.</text>
  <text class="body" x="419" y="1611">Update its hash in the manifest.</text>
  <text class="code red" x="419" y="1648">eligible: false</text>
  <text class="code-small red" x="419" y="1683">VALIDATION_EVIDENCE_MISMATCH</text>
  <rect x="742" y="1520" width="322" height="190" rx="10" fill="#fcefeb" stroke="#deb9b0"/>
  <text class="label red" x="762" y="1553">Attack B · extends A</text>
  <text class="body" x="762" y="1584">Also rewrite the statement</text>
  <text class="body" x="762" y="1611">and dependent public hashes.</text>
  <text class="code red" x="762" y="1648">eligible: false</text>
  <text class="code-small red" x="762" y="1683">SIGNATURE_INVALID</text>

  <text class="small" x="560" y="1762" text-anchor="middle">Recorded evaluation time: 2026-09-23T04:39:04Z. Full identities and evidence are linked below the diagram.</text>
  <text x="560" y="1789" text-anchor="middle" font-size="18" font-weight="700">Real hosted cryptography remains unverified. This test does not authorize release.</text>
</svg>
